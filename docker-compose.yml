# ──────────────────────────────────────────────────────────────
# Docker Compose — App + PostgreSQL with pgvector
# ──────────────────────────────────────────────────────────────
#
# Usage:
#   docker compose up --build        (first time / after code changes)
#   docker compose up -d             (detached)
#   docker compose down              (stop)
#   docker compose logs -f app       (stream app logs)
#
# ──────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL + pgvector ──
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-katnoria_RAG}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-katnoria_RAG}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── FastAPI Application ──
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override localhost → container hostname
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./Data:/app/Data:ro
      - ./NodeCache:/app/NodeCache

volumes:
  pgdata:

