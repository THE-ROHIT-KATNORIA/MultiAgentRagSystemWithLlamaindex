# ──────────────────────────────────────────────────────────────
# Render Blueprint Specification
# ──────────────────────────────────────────────────────────────
# Deploy automatically on Render by connecting your GitHub repo.
# ──────────────────────────────────────────────────────────────

services:
  - type: web
    name: multi-agent-rag-system
    env: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        value: 5432
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_SSLMODE
        value: require
      - key: CORS_ORIGINS
        value: "*"
      # For Render Free Tier (512MB RAM), keep reranker false to avoid OOM.
      # If upgraded to paid Starter plan (>=1GB RAM), change to "true".
      - key: ENABLE_RERANKER
        value: "false"

